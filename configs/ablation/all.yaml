# Each ablation varies ONE factor (others at base config). Interaction grids are marked (grid2).
ablations:
  A1_membership_type:      {grid: {fuzzy.membership: [gaussian, it2_uncertain_sigma, it2_uncertain_mean],
                                   fuzzy.reducer: [nie_tan]}}
  A2_fou_width:            {grid: {fuzzy.fou_init: [0.0001, 0.1, 0.3, 0.6, 1.0], fuzzy.fou_learnable: [true, false]}}
  A3_n_rules:              {grid: {fuzzy.n_rules: [2, 4, 6, 8, 12, 16, 24, 32]}}
  A4_rule_initializer:     {grid: {fuzzy.initializer: [random, kmeans, teacher_tree]}}
  A5_type_reducer:         {grid: {fuzzy.reducer: [nie_tan, bounds_mixing, weighted_average]}}
  A6_consequent_order:     {grid: {fuzzy.consequent_order: [0, 1]}}
  A6b_tnorm:               {grid: {fuzzy.tnorm: [product, min]}}
  A7_noise_aware_training: {grid: {train.train_noise_sigma: [0.0, 0.05, 0.1, 0.2]}}   # also run for T1
  A8_loss:                 {grid: {train.loss: [auto, kl_soft]}}
  A9_dagger_rounds:        {grid: {data.dagger_rounds: [0, 1, 3, 5]}}
  A10_regularisers:        {grid: {train.lambda_fou: [0.0, 0.01, 0.1], train.lambda_sparsity: [0.0, 0.01]}}
  A11_data_size:           {grid: {data.n_steps: [5000, 10000, 25000, 50000, 100000]}}
